<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>توسعه فرانت‌اند با هوش مصنوعی | Presenter Deck</title>
  
  <!-- Google Fonts: Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet" />

  <!-- Letters Style Design Tokens -->
  <style>
    :root {
      /* Letters Palette */
      --color-obsidian: #070709;
      --color-paper-white: #ffffff;
      --color-cloud-gray: #f5f5f5;
      --color-sky-tint: #d7e6f5;
      --color-charcoal: #60606c;
      --color-slate: #8b8b8b;
      --color-ink: #151515;
      --color-surgical-blue: #2597d0;
      --color-sky-gradient: linear-gradient(180deg, #779bc1 0%, #9abfda 58%, #cbdcec 100%);

      /* Geometry & Radii */
      --radius-badge: 6px;
      --radius-card: 18px;
      --radius-pill: 100px;

      /* Typography */
      --font-sans: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Shadows */
      --shadow-subtle: 0 4px 20px -2px rgba(215, 230, 245, 0.7), 0 2px 6px -1px rgba(7, 7, 9, 0.04);
      --shadow-elevated: 0 12px 32px -4px rgba(215, 230, 245, 0.9), 0 4px 12px -2px rgba(7, 7, 9, 0.06);

      /* Transitions */
      --transition-smooth: 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      letter-spacing: 0;
      background-color: var(--color-paper-white);
      color: var(--color-obsidian);
      direction: rtl;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
